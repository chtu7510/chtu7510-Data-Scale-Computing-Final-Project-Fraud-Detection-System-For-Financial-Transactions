services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  tcp-server:
    build:
      context: .
      dockerfile: Dockerfile.producer
    environment:
      PYTHONPATH: /app
      TX_HOST: 0.0.0.0
      TX_PORT: 5050
    command: ["python", "Generators/tcp_server.py"]
    ports:
      - "5050:5050"

  tcp-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    depends_on:
      - tcp-server
    environment:
      PYTHONPATH: /app
      TX_HOST: tcp-server
      TX_PORT: 5050
      TPS: 50           # adjustable
      NUM_WORKERS: 5    # adjustable
      TRANSPORT: TCP
    command: ["python", "Generators/tcp_client.py"]

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.producer
    depends_on:
      - kafka
    environment:
      PYTHONPATH: /app
      API_KEY: changeme
      RATE_LIMIT_PER_MIN: 5000
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: transactions
      KAFKA_DLQ_TOPIC: transactions-dlq
      KAFKA_CONNECT_TIMEOUT_SEC: 3
      KAFKA_SEND_TIMEOUT_SEC: 3
    command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"

  enricher:
    build:
      context: .
      dockerfile: Dockerfile.producer
    depends_on:
      - kafka
    environment:
      PYTHONPATH: /app
      KAFKA_BROKERS: kafka:9092
      INPUT_TOPIC: transactions
      OUTPUT_TOPIC: enriched-transactions
      DLQ_TOPIC: transactions-dlq
      GROUP_ID: enricher-group
    command: ["python", "services/enricher.py"]

  risk-adapter:
    build:
      context: .
      dockerfile: Dockerfile.producer
    depends_on:
      - kafka
    environment:
      PYTHONPATH: /app
      KAFKA_BROKERS: kafka:9092
      INPUT_TOPIC: enriched-transactions
      OUTPUT_TOPIC: scored-transactions
      DLQ_TOPIC: transactions-dlq
      GROUP_ID: risk-adapter-group
    command: ["python", "services/risk_adapter.py"]

  decision-engine:
    build:
      context: .
      dockerfile: Dockerfile.producer
    depends_on:
      - kafka
    environment:
      PYTHONPATH: /app
      KAFKA_BROKERS: kafka:9092
      INPUT_TOPIC: scored-transactions
      OUTPUT_TOPIC: decisions
      DLQ_TOPIC: transactions-dlq
      GROUP_ID: decision-engine-group
      ALLOW_THRESHOLD: 0.3
      HOLD_THRESHOLD: 0.7
    command: ["python", "services/decision_engine.py"]

  http-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    depends_on:
      - api-gateway
    environment:
      PYTHONPATH: /app
      TRANSPORT: HTTP
      HTTP_ENDPOINT: http://api-gateway:8080/transactions
      API_KEY: changeme
      TPS: 25
      NUM_WORKERS: 5
    command: ["python", "Generators/tcp_client.py"]
